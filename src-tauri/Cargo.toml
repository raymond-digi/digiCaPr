[package]
name = "canadian-payroll"
version = "26.7.3"
description = "Digi Canadian Payroll App"
authors = ["CPR Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.40"
rusqlite = "0.35"
csv = "1.4"

# Internal crates - no changes needed to core functionality
cpr-core = { path = "../crates/cpr-core" }
cpr-db = { path = "../crates/cpr-db" }
cpr-reports = { path = "../crates/cpr-reports" }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
