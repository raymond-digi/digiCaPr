[workspace]
members = [
    "crates/cpr-core",
    "crates/cpr-db",
    "crates/cpr-reports",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "26.7.1"
edition = "2021"
authors = ["CPR Team"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock", "std"], default-features = false }
rust_decimal = { version = "1.40", features = ["serde", "maths"] }
rust_decimal_macros = "1.40"
thiserror = "2.0"
anyhow = "1.0"

# Database
rusqlite = { version = "0.35", features = ["bundled", "chrono"] }
argon2 = "0.5"
rand = "0.8"

# Reports
printpdf = "0.5"
csv = "1.4"

# Internal crates
cpr-core = { path = "crates/cpr-core" }
cpr-db = { path = "crates/cpr-db" }
cpr-reports = { path = "crates/cpr-reports" }
